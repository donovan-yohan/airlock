name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Enable user namespaces on the ephemeral CI runner
        run: |
          # GitHub-hosted Ubuntu can disable the deployment prerequisite even
          # though the runner VM grants passwordless sudo. Configure only this
          # disposable job, then keep the real unprivileged bwrap preflight.
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Bubblewrap unprivileged-userns preflight
        run: |
          bwrap --version
          bwrap --unshare-user --unshare-pid --proc /proc --dev /dev --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /usr/bin/true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: ./scripts/smoke-local.sh

  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
      - name: Enable user namespaces on the ephemeral CI runner
        run: |
          # GitHub-hosted Ubuntu can disable the deployment prerequisite even
          # though the runner VM grants passwordless sudo. Configure only this
          # disposable job, then keep the real unprivileged bwrap preflight.
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Bubblewrap unprivileged-userns preflight
        run: |
          bwrap --version
          bwrap --unshare-user --unshare-pid --proc /proc --dev /dev --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /usr/bin/true
      - name: Validate Claude and Codex packaging
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/airlock_bootstrap.py validate
          git diff --check HEAD^ HEAD
          systemd-analyze --user verify deploy/systemd/airlock-requester.service
          systemd-analyze --user verify deploy/systemd/airlock-trusted.service
          ./docs/diagrams/render.sh
          git diff --exit-code -- docs/assets/diagrams
      - name: Test Hermes integration
        working-directory: integrations/hermes
        run: |
          uv lock --check
          uv run --locked pytest -q
          uv run --locked ruff check hermes_plugin_airlock tests ../../tests
          uv run --locked python -m compileall -q __init__.py hermes_plugin_airlock tests ../../tests
      - name: Test Hermes integration against the Go service
        run: |
          go build -o /tmp/airlock ./cmd/airlock
          cd integrations/hermes
          AIRLOCK_BINARY=/tmp/airlock uv run --locked pytest -q tests/test_real_airlock.py
      - name: Check out the pinned Hermes runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: cb47f59ffa1056732c0a5194d2a1847dc64c2c37 # pragma: allowlist secret
          path: .ci/hermes-agent
          persist-credentials: false
      - name: Validate Hermes plugin manifest
        run: |
          uv run --locked --directory .ci/hermes-agent hermes plugins doctor "$GITHUB_WORKSPACE/integrations/hermes" --ci
